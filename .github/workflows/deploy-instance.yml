name: Deploy instance

on:
  pull_request:
    types: [opened, reopened, labeled, synchronize]

# Cancel previous runs of the same workflow and PR number or branch/tag
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read           # for t3chguy/wait-on-check-action
  pull-requests: write   # for actions-cool/maintain-one-comment

jobs:
  would-run:
    # Stubbed in this test fork: this workflow's triggers are kept as they were, and its jobs
    # replaced by this one step, which only records that the workflow fired.
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record that this workflow would have run
        env:
          WORKFLOW: ${{ github.workflow }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          echo "workflow: $WORKFLOW"
          echo "event:    $EVENT"
          echo "ref:      $REF"
          echo "sha:      $SHA"
