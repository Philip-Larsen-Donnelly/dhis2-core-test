name: SonarQube analysis
env:
  # This is to make sure Maven don't timeout fetching dependencies. See: https://github.com/actions/virtual-environments/issues/1499
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.class=standard -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.httpconnectionManager.ttlSeconds=125
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SONAR_TOKEN: ${{ secrets.DHIS2_BOT_SONARCLOUD_TOKEN }}
on:
  push:
    branches:
      - master
      - '2.3[1-9]'
      - '2.4[0-9]'
  pull_request:
    branches:
      - master
      - '2.3[1-9]'
      - '2.4[0-9]'
concurrency:
    group: ${{ github.workflow}}-${{ github.ref }}
    cancel-in-progress: true
jobs:
  would-run:
    # Stubbed in this test fork: this workflow's triggers are kept as they were, and its jobs
    # replaced by this one step, which only records that the workflow fired.
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record that this workflow would have run
        env:
          WORKFLOW: ${{ github.workflow }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          echo "workflow: $WORKFLOW"
          echo "event:    $EVENT"
          echo "ref:      $REF"
          echo "sha:      $SHA"
