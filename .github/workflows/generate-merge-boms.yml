name: Generate and Merge SBOMs and Upload them to DependencyTrack every night

on:
  schedule:
    - cron: "0 0 * * *" # Run every day at midnight

concurrency:
  group: ${{ github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  would-run:
    # Stubbed in this test fork: this workflow's triggers are kept as they were, and its jobs
    # replaced by this one step, which only records that the workflow fired.
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record that this workflow would have run
        env:
          WORKFLOW: ${{ github.workflow }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          echo "workflow: $WORKFLOW"
          echo "event:    $EVENT"
          echo "ref:      $REF"
          echo "sha:      $SHA"
